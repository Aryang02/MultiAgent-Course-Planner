services:
  app:
    build: .
    container_name: mcp_app
    command: ["./entrypoint.sh"]
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - ./.env
    depends_on:
      - db

  db:
    image: postgres:latest
    container_name: mcp_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: nerd@123
      POSTGRES_DB: demo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  
volumes:
  pgdata: