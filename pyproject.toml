[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multiagent-course-planner"
version = "0.1.0"
description = "Multi-agent learning platform with study plan generation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0,<0.116",
    "uvicorn[standard]>=0.34.0,<0.35",
    "sqlalchemy>=2.0.36,<2.1",
    "psycopg2-binary>=2.9.10,<3",
    "alembic>=1.14.0,<2",
    "pydantic>=2.10.0,<3",
    "email-validator>=2.2.0,<3",
    "python-dotenv>=1.0.1,<2",
    "python-jose[cryptography]>=3.3.0,<4",
    "bcrypt>=4.2.0,<5",
    "python-multipart>=0.0.18,<0.1",
    "litellm>=1.55.0,<2",
    "langchain-openai>=0.3.0,<0.4",
    "langchain>=0.3.0,<0.4",
    "langchain-community>=0.3.0,<0.4",
    "langchain-google-genai>=2.0.0,<3",
    "langchain-pinecone>=0.2.0,<0.3",
    "pinecone>=5.4.0,<6",
    "python-docx>=1.1.0,<2",
    "Pillow>=11.0.0,<12",
    "httpx>=0.28.0,<0.29",
    "google-adk>=0.1.0",
    "a2a-sdk>=0.2.0",
    "mcp[cli]>=1.0.0,<2",
    "celery[redis]>=5.6.0,<6",
    "redis>=5.2.0,<6",
    "slowapi>=0.1.9,<0.2",
    "structlog>=24.4.0,<25",
    "prometheus-fastapi-instrumentator>=7.0.0,<8",
    "prometheus-client>=0.21.0,<0.22",
    "gunicorn>=23.0.0,<24",
    "sentry-sdk[fastapi,celery,sqlalchemy]>=2.19.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9",
    "pytest-asyncio>=0.24.0,<0.25",
    "pytest-cov>=6.0.0,<7",
    "factory-boy>=3.3.0,<4",
    "httpx>=0.28.0,<0.29",
    "ruff>=0.8.0,<0.9",
    "mypy>=1.13.0,<2",
    "types-python-jose>=3.3.0,<4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=src/api --cov=src/auth --cov=src/repositories --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.12"
packages = ["src"]
plugins = ["sqlalchemy.ext.mypy.plugin"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = [
    "src.agents.*",
    "src.a2a_server.*",
    "src.database.*",
    "src.utils.*",
    "src.core.*",
    "src.repositories.*",
    "src.api.*",
    "src.auth.*",
    "src.worker.*",
    "src.services.*",
]
ignore_errors = true
